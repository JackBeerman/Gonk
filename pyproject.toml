[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gonk"
version = "1.0.0"
description = "Daily email report of objects entering and leaving Earth orbit, from Space-Track.org"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.scripts]
gonk = "gonk.cli:main"

[tool.setuptools]
packages = ["gonk"]
